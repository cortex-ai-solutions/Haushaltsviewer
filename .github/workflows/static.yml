# Deployt docs/ direkt auf GitHub Pages – läuft bei jedem Push auf main.
# Kein Pipeline-Rebuild nötig (PDFs/Parsing werden separat via deploy.yml ausgelöst).
name: GitHub Pages – Deploy docs/

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: docs/ als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
